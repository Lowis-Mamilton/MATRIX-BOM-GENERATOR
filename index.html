<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MATRIX Store</title>
  <link rel="shortcut icon" href="img/Matrix-icon.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shopstyle.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">
        <img src="img/Matrix-icon-white.png" alt="MATRIX Logo">
        <div class="logo-text">
          <span class="logo-main">MATRIX</span>
          <span class="logo-sub">ROBOTICS SYSTEM</span>
        </div>
      </div>
      <div class="header-right">
        <div class="header-tagline">Professional Robotics Components</div>
        <button class="export-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export
        </button>
      </div>
    </div>
  </header>

  <div class="wrapper">
    <!-- Desktop: left sidebar / Mobile: top nav bar -->
    <nav class="sidebar">
      <div class="sidebar-label">CATEGORIES</div>
      <ul id="sidebar-menu"></ul>
    </nav>
    <main class="main-content" id="content-area"></main>
  </div>

  <!-- Cart FAB -->
  <div id="cart-fab" aria-label="Shopping Bag">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
      <line x1="3" y1="6" x2="21" y2="6"/>
      <path d="M16 10a4 4 0 01-8 0"/>
    </svg>
    <span id="cart-count">0</span>
  </div>

  <div id="cart-overlay"></div>

  <aside id="selected-panel">
    <div class="panel-header">
      <div class="panel-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        Order Summary
      </div>
      <button id="panel-close">✕</button>
    </div>
    <div id="selected-list"></div>
    <div class="cart-summary">
      <div class="summary-row">
        <span>Subtotal</span>
        <span class="val">NT$<span id="cart-subtotal">0</span></span>
      </div>
      <div class="summary-row muted">
        <span>Shipping</span>
        <span id="cart-shipping">Calculated at export</span>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-row total-row">
        <span>Total</span>
        <span class="val">NT$<span id="cart-total">0</span></span>
      </div>
    </div>
  </aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="shopscript.js"></script>
</body>
</html>
